[package]
name = "cosmic-workspaces"
version = "1.0.12"
edition = "2024"
rust-version = "1.99"

[dependencies]
anyhow = "1.0.104"
calloop = { version = "0.14.5", features = ["executor"] }
clap = { version = "4.6.7", features = ["derive"] }
cosmic-bg-config = { git = "https://github.com/hahnavi/cosmic-bg", branch = "hahnavi" }
cosmic-comp-config = { git = "https://github.com/hahnavi/cosmic-comp", branch = "hahnavi" }
env_logger = "0.11.9"
gbm = "0.18.0"
libcosmic = { git = "https://github.com/hahnavi/libcosmic", branch = "hahnavi", default-features = false, features = [
    "tokio",
    "wayland",
    "single-instance",
    "desktop",
    "multi-window",
    "winit",
] }
cosmic-config = { git = "https://github.com/hahnavi/libcosmic", branch = "hahnavi" }
freedesktop-icons = { package = "cosmic-freedesktop-icons", git = "https://github.com/pop-os/freedesktop-icons" }

memmap2 = "0.9.11"
tokio = "1.53.2"
wayland-protocols = "0.32.10"
delegate = "0.13.5"
itertools = "0.15.0"
log = "0.4.34"
i18n-embed-fl = "0.10"
rust-embed = "8.11.0"
rustix = { version = "1.1.5", features = ["fs", "shm"] }
calloop-wayland-source = "0.4.1"
aliasable = "0.1.3"
zbus = "5.13.2"
tokio-stream = { version = "0.1.19", features = ["sync"] }
ash = { version = "0.38.0", features = ["loaded"] }
bytemuck = "1.25.2"
cosmic-panel-config = { git = "https://github.com/hahnavi/cosmic-panel", branch = "hahnavi" }

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[features]
default = ["wgpu"]
wgpu = ["libcosmic/wgpu"]
# Debugging features
force-shm-screencopy = []
no-subsurfaces = ["force-shm-screencopy"]
mock-backend = []

[profile.dev]
# Not usable at opt-level 0, at least with software renderer
opt-level = 1

